<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E DIGITAL ERT ECOGREEN | Emergency Response Team</title>
  
  <!-- Google Font & Favicon -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }

    body { 
      background: radial-gradient(circle at 50% 30%, #7f1d1d 0%, #450a0a 50%, #1c0505 100%);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* Container Layar Splash */
    .splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
    }

    /* Logo Badge ERT Container */
    .brand-icon-wrapper {
      position: relative;
      width: 90px;
      height: 90px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5),
                  0 0 25px rgba(239, 68, 68, 0.35);
      margin-bottom: 1.5rem;
      animation: float 3s ease-in-out infinite;
    }

    .brand-icon-wrapper svg {
      width: 48px;
      height: 48px;
      fill: #ef4444;
      stroke: #ffffff;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 2px 8px rgba(239, 68, 68, 0.6));
    }

    /* Teks Judul & Subtitle */
    .splash-title {
      color: #ffffff;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      line-height: 1.2;
    }

    .splash-title span {
      color: #ef4444;
    }

    .splash-sub {
      color: #fca5a5;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.5px;
      margin-top: 0.4rem;
      opacity: 0.9;
    }

    /* Progress Loader Modern */
    .loader-container {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 3.5px solid rgba(239, 68, 68, 0.2);
      border-top-color: #ef4444;
      border-right-color: #dc2626;
      border-radius: 50%;
      animation: spin 0.85s cubic-bezier(0.55, 0.25, 0.25, 0.7) infinite;
    }

    .loading-status {
      font-size: 0.8rem;
      color: #fca5a5;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* Animasi */
    @keyframes spin { 
      to { transform: rotate(360deg); } 
    }

    @keyframes float { 
      0%, 100% { transform: translateY(0px); } 
      50% { transform: translateY(-6px); } 
    }

    /* Tampilan Iframe */
    iframe {
      display: none;
      width: 100vw;
      height: 100vh;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Layar Splash Screen -->
  <div class="splash" id="splash">
    <!-- Ikon Shield Emergency (Sesuai Logo ERT) -->
    <div class="brand-icon-wrapper">
      <svg viewBox="0 0 24 24">
        <!-- Bentuk Perisai -->
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="#dc2626" stroke="#ffffff" stroke-width="1.8"/>
        <!-- Siluet Lambang Bagian Dalam -->
        <path d="M12 6v12M12 12h5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- Teks Branding -->
    <h1 class="splash-title">E DIGITAL ERT <span>ECOGREEN</span></h1>
    <p class="splash-sub">Emergency Response Team Roster & Monitoring System</p>

    <!-- Loading Indicator -->
    <div class="loader-container">
      <div class="spinner"></div>
      <span class="loading-status">Memuat Portal...</span>
    </div>
  </div>

  <!-- Google Apps Script Iframe -->
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycby1pYrRaasnMgMSN2BVBCok6GJLaE1fHX5K1HwgInrjHD8RAp-POx-m74hU711OJQ/exec"
    allowfullscreen
    onload="frameLoaded()">
  </iframe>

  <script>
    function frameLoaded() {
      const splash = document.getElementById("splash");
      const appFrame = document.getElementById("appFrame");
      
      // Animasi Fade Out Halus
      splash.style.opacity = "0";
      setTimeout(() => {
        splash.style.display = "none";
        appFrame.style.display = "block";
      }, 600);
    }
  </script>

</body>
</html>
